<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trigano VDL · Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="home">
    <header>
      <div class="container navbar">
        <div class="brand">
          <img src="assets/logo-placeholder.svg" alt="Trigano VDL" />
          <span>Trigano VDL Media</span>
        </div>
        <div class="nav-actions">
          <a class="btn ghost small" href="admin.html">Admin</a>
          <button class="btn ghost small logout-btn" type="button" data-i18n="logout">Déconnexion</button>
          <select id="lang-select" aria-label="Langue">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="it">IT</option>
          </select>
        </div>
      </div>
    </header>
    <main>
      <section class="container">
        <div class="hero">
          <div class="breadcrumbs"></div>
          <h1 data-i18n="homeTitle">Centre media privé Trigano VDL</h1>
          <p data-i18n="homeIntro">Accédez rapidement aux contenus officiels par marque, catégorie et pack.</p>
        </div>
        <div class="grid brand-grid"></div>
      </section>
    </main>
    <footer class="container">
      <p>Support dédié : media@trigano-vdl.com · SLA 24h · Accès sécurisé & traçable.</p>
    </footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
