<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trigano VDL · Pack</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="pack">
    <header>
      <div class="container navbar">
        <div class="brand">
          <img src="assets/logo-placeholder.svg" alt="Trigano VDL" />
          <span>Trigano VDL Media</span>
        </div>
        <div class="nav-actions">
          <a class="btn ghost small" href="home.html">Home</a>
          <a class="btn ghost small" href="admin.html">Admin</a>
          <button class="btn ghost small logout-btn" type="button" data-i18n="logout">Déconnexion</button>
          <select id="lang-select" aria-label="Langue">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="it">IT</option>
          </select>
        </div>
      </div>
    </header>
    <main>
      <section class="container">
        <div class="breadcrumbs"></div>
        <div class="hero pack-hero">
          <h1>Pack</h1>
          <p></p>
          <div class="hero-meta">
            <span class="pack-size"></span>
            <span class="pack-langs"></span>
          </div>
          <button class="btn" type="button" data-i18n="packDownload">Télécharger le pack</button>
        </div>
        <ul class="pack-files"></ul>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
